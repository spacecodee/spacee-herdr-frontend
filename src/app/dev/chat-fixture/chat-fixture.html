<div class="bg-background text-foreground fixed inset-x-0 top-0 flex h-dvh flex-col">
  <app-view-header
    class="border-border border-b"
    heading="web"
    agent="claude"
    [status]="status"
    [line]="line()"
    [mode]="mode"
  >
    <span class="size-row shrink-0"></span>
  </app-view-header>
  <div class="relative min-h-0 flex-1 overflow-hidden">
    @if (terminalMode) {
      <pre class="term h-full overflow-hidden p-2">{{ lines.join('\n') }}</pre>
    } @else {
      <div class="absolute inset-0 flex flex-col">
        <app-chat-view [messages]="messages()" [rewoundId]="rewoundId()" (edit)="onEdit($event)" [state]="state" [noneReason]="reason" [status]="status" address="fixture/t1" [agent]="agent" [typing]="typing()" (denyText)="startDenyText($event)" />
      </div>
    }
    @if (disconnected) {
      <div class="bg-background/80 absolute inset-0 z-10 flex items-center justify-center">
        <app-connection-card text="Connection lost" [canReattach]="true" />
      </div>
    }
  </div>
  <app-update-card class="shrink-0" />
  <app-compose-bar address="fixture/t1" [placeholder]="placeholder()" [editing]="editing()" (editCancel)="editing.set(null); compose()?.fill('')" (focusedChange)="focused.set($event)" />
  @if (focused()) {
    <app-key-bar [layout]="terminalMode ? 'full' : 'chat'" />
  }
</div>
