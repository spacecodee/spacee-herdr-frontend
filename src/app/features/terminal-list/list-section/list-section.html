<section>
  <div
    hlmCollapsible
    [expanded]="open()"
    (expandedChange)="groups.setOpen(sectionId(), $event)"
  >
    <div class="flex items-center">
      <ng-template #trigger>
        <button hlmCollapsibleTrigger class="section-trigger">
          <ng-icon
            name="lucideChevronRight"
            size="16"
            aria-hidden="true"
            class="chevron"
            [class.rotate-90]="open()"
          />
          <span data-name class="min-w-0 flex-1 truncate text-left">{{ name() }}</span>
          @if (note(); as note) {
            <span class="note">{{ note }}</span>
          }
          @for (c of callouts(); track c.text) {
            <span data-summary class="summary" [class]="c.ink"
              ><span data-dot aria-hidden="true" class="size-2 rounded-full" [class]="c.dot"></span
              >{{ c.text }}</span
            >
          }
          <span data-count class="count">{{ summary().total }}</span>
        </button>
      </ng-template>
      @if (level() === 2) {
        <h2 class="m-0 min-w-0 flex-1"><ng-container *ngTemplateOutlet="trigger" /></h2>
      } @else {
        <h3 class="m-0 min-w-0 flex-1"><ng-container *ngTemplateOutlet="trigger" /></h3>
      }
      @if (spaceId(); as id) {
        <app-layout-menu [spaceId]="id" [label]="name()" />
      }
    </div>
    <div hlmCollapsibleContent>
      <ng-content />
    </div>
  </div>
</section>
