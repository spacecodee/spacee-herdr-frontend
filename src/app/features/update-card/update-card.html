@if (updates.cardVisible()) {
  <section
    role="status"
    aria-label="App update"
    data-update-card
    class="bg-card border-border mx-gutter mb-[max(0.75rem,env(safe-area-inset-bottom))] mt-2 flex flex-col gap-2 rounded-group border p-3"
  >
    <div class="flex items-center gap-3">
      <span class="bg-muted flex size-10 shrink-0 items-center justify-center rounded-control">
        <ng-icon name="lucideRefreshCw" size="20" aria-hidden="true" />
      </span>
      <div class="flex min-w-0 flex-1 flex-col">
        <h2 class="text-body font-semibold">Update ready</h2>
        <p class="text-muted-foreground text-footnote">Reload to use the new version.</p>
      </div>
    </div>
    <div class="flex justify-end gap-2">
    <button
      hlmBtn
      type="button"
      variant="ghost"
      class="h-row shrink-0 rounded-control px-3"
      [disabled]="updates.applying()"
      (click)="updates.later()"
    >
      Later
    </button>
    <button
      hlmBtn
      type="button"
      class="h-row shrink-0 gap-2 rounded-control px-4"
      [disabled]="updates.applying()"
      (click)="updates.applyUpdate()"
    >
      @if (updates.applying()) {
        <hlm-spinner aria-label="Reloading" />
        Reloading…
      } @else {
        Reload
      }
    </button>
    </div>
  </section>
}
