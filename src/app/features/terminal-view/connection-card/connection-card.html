<div
  [attr.role]="role()"
  data-connection-card
  class="bg-card border-border mx-4 flex max-w-sm flex-col items-center gap-3 rounded-group border p-6 text-center"
>
  <span class="bg-muted text-muted-foreground flex size-12 items-center justify-center rounded-full">
    <ng-icon name="lucideUnplug" size="24" aria-hidden="true" />
  </span>
  <h2 class="text-body font-semibold">{{ title() }}</h2>
  <p class="text-muted-foreground text-footnote">{{ text() }}</p>
  @if (canReattach()) {
    <button hlmBtn type="button" class="h-row w-full rounded-control" (click)="reattach.emit()">Reattach</button>
  }
  <a routerLink="/" class="text-muted-foreground text-footnote inline-flex min-h-row items-center px-3 font-medium">Back</a>
</div>
