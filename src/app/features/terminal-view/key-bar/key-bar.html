@if (layout() === 'chat') {
  <div
    role="toolbar"
    aria-label="Chat keys"
    [style.padding-bottom]="keyboardOpen() ? '0.25rem' : null"
    class="bg-background flex shrink-0 gap-1 px-1 pt-1 pr-[max(0.25rem,env(safe-area-inset-right))] pb-[max(0.25rem,env(safe-area-inset-bottom))] pl-[max(0.25rem,env(safe-area-inset-left))]"
  >
    <button
      type="button"
      class="key"
      aria-label="Slash commands"
      [attr.aria-pressed]="slashOpen()"
      [class.key-on]="slashOpen()"
      [disabled]="disabled()"
      (pointerdown)="keepFocus($event)"
      (mousedown)="keepFocus($event)"
      (click)="slashToggle.emit()"
    >
      /
    </button>
    <button type="button" class="key" [disabled]="disabled()" (pointerdown)="keepFocus($event)" (mousedown)="keepFocus($event)" (click)="key.emit('esc')">
      Esc
    </button>
    <button type="button" class="key" aria-label="Interrupt (Ctrl+C)" [disabled]="disabled()" (pointerdown)="keepFocus($event)" (mousedown)="keepFocus($event)" (click)="interrupt.emit()">
      Ctrl+C
    </button>
  </div>
} @else {
<div
  role="toolbar"
  [style.padding-bottom]="keyboardOpen() ? '0.25rem' : null"
  aria-label="Terminal keys"
  class="bg-background flex shrink-0 gap-1 px-1 pt-1 pr-[max(0.25rem,env(safe-area-inset-right))] pb-[max(0.25rem,env(safe-area-inset-bottom))] pl-[max(0.25rem,env(safe-area-inset-left))]"
>
  <button
    type="button"
    class="key"
    aria-label="Direct typing"
    [attr.aria-pressed]="mode() === 'direct'"
    [class.key-on]="mode() === 'direct'"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="modeToggle.emit()"
  >
    <ng-icon
      [name]="mode() === 'compose' ? 'lucideKeyboard' : 'lucideMessageSquare'"
      size="18"
      aria-hidden="true"
    />
  </button>
  <button
    type="button"
    class="key"
    [disabled]="disabled()"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="key.emit('esc')"
  >
    Esc
  </button>
  <button
    type="button"
    class="key"
    [disabled]="disabled()"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="key.emit('tab')"
  >
    Tab
  </button>
  <button
    type="button"
    class="key"
    [attr.aria-pressed]="ctrl()"
    [class.key-on]="ctrl()"
    [disabled]="disabled()"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="toggleCtrl()"
  >
    Ctrl
  </button>
  <button
    type="button"
    class="key"
    aria-label="Arrow left"
    [disabled]="disabled()"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="key.emit('left')"
  >
    <ng-icon name="lucideArrowLeft" size="18" aria-hidden="true" />
  </button>
  <button
    type="button"
    class="key"
    aria-label="Arrow up"
    [disabled]="disabled()"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="key.emit('up')"
  >
    <ng-icon name="lucideArrowUp" size="18" aria-hidden="true" />
  </button>
  <button
    type="button"
    class="key"
    aria-label="Arrow down"
    [disabled]="disabled()"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="key.emit('down')"
  >
    <ng-icon name="lucideArrowDown" size="18" aria-hidden="true" />
  </button>
  <button
    type="button"
    class="key"
    aria-label="Arrow right"
    [disabled]="disabled()"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="key.emit('right')"
  >
    <ng-icon name="lucideArrowRight" size="18" aria-hidden="true" />
  </button>
  <button
    type="button"
    class="key"
    aria-label="Enter key"
    [disabled]="disabled()"
    (pointerdown)="keepFocus($event)"
    (mousedown)="keepFocus($event)"
    (click)="key.emit('enter')"
  >
    <ng-icon name="lucideCornerDownLeft" size="18" aria-hidden="true" />
  </button>
</div>
}
