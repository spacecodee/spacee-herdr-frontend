<div
  #root
  data-probe="root"
  class="screen-root bg-background text-foreground fixed inset-x-0 top-0 flex flex-col"
  [class.h-dvh]="viewport() === null"
  [style.height.px]="viewport()?.height"
  [style.top.px]="viewport()?.top"
>
  <app-view-header
    data-probe="header"
    class="border-border border-b"
    [heading]="heading()"
    [agent]="kind()"
    [program]="program()"
    [status]="terminal()?.status?.state ?? null"
    [line]="statusLine()"
    [mode]="mode()"
    (modeChange)="setViewMode($event)"
  >
    <app-layout-menu [address]="address" context="view">
      <a
        hlmBtn
        variant="ghost"
        routerLink="/settings"
        [queryParams]="{ from: router.url }"
        class="h-row w-full justify-start gap-2 rounded-control"
      >
        <ng-icon name="lucideSettings" size="20" aria-hidden="true" />
        Settings
      </a>
    </app-layout-menu>
  </app-view-header>

  <div
    data-probe="screen"
    class="relative min-h-0 flex-1 overflow-hidden pt-1 pr-[max(0.375rem,env(safe-area-inset-right))] pl-[max(0.375rem,env(safe-area-inset-left))]"
  >
    <div
      #screen
      class="h-full w-full"
      [class.invisible]="mode() === 'chat'"
      [attr.inert]="mode() === 'chat' ? '' : null"
    ></div>
    @if (mode() === 'chat') {
      <div class="bg-background absolute inset-0 flex flex-col">
        <app-chat-view
          [messages]="chat.messages()"
          [state]="chat.state()"
          [noneReason]="chat.noneReason()"
          [status]="terminal()?.status?.state"
          (showTerminal)="setViewMode('terminal')"
        />
      </div>
    }
    @if (banner(); as banner) {
      <div class="bg-background/80 absolute inset-0 z-10 flex items-center justify-center">
        <app-connection-card
          [role]="banner.role"
          [title]="phase() === 'ended' ? 'Session ended' : 'Disconnected'"
          [text]="banner.text"
          [canReattach]="banner.canReattach"
          (reattach)="reattach()"
        />
      </div>
    }
  </div>

  @if (mode() === 'chat' && slashOpen()) {
    <ul aria-label="Slash commands" class="bg-background flex shrink-0 gap-1 overflow-x-auto px-2 py-1.5">
      @for (command of slashChips(); track command) {
        <li class="shrink-0">
          <button type="button" class="slash-chip" (pointerdown)="$event.preventDefault()" (mousedown)="$event.preventDefault()" (click)="useSlash(command)">{{ command }}</button>
        </li>
      }
    </ul>
  }

  @if (mode() === 'chat' || inputMode() === 'compose') {
    <app-compose-bar
      data-probe="compose"
      [address]="address"
      [disabled]="phase() !== 'attached'"
      [ctrl]="ctrl()"
      (send)="onCompose($event)"
      (ctrlChar)="onComposeCtrl($event)"
      (focusedChange)="composeFocused.set($event)"
    />
  }

  @if (accessoryVisible()) {
    <app-key-bar
      data-probe="keybar"
      [disabled]="phase() !== 'attached'"
      [mode]="inputMode()"
      [keyboardOpen]="viewport() !== null"
      [layout]="mode() === 'chat' ? 'chat' : 'full'"
      [slashOpen]="slashOpen()"
      (slashToggle)="slashOpen.set(!slashOpen())"
      (interrupt)="interrupt()"
      [(ctrl)]="ctrl"
      (key)="onBarKey($event)"
      (modeToggle)="toggleMode()"
    />
  }
</div>
