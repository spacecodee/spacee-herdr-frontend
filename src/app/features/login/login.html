<main
  class="page-padding mx-auto flex min-h-dvh max-w-md flex-col justify-center gap-8 pt-[max(1rem,env(safe-area-inset-top))]"
>
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="bg-muted flex size-[4.5rem] items-center justify-center rounded-full">
      <ng-icon name="lucideSquareTerminal" size="28" aria-hidden="true" />
    </span>
    <h1 class="text-title font-bold tracking-tight">Herdr</h1>
    <p class="text-muted-foreground text-body">Your terminals, in your pocket.</p>
  </div>
  <form class="flex flex-col gap-3" (submit)="$event.preventDefault(); submit()">
    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="token" class="sr-only">Access token</label>
      <div class="relative">
        <ng-icon
          name="lucideLock"
          size="18"
          aria-hidden="true"
          class="text-muted-foreground pointer-events-none absolute top-1/2 left-4 -translate-y-1/2"
        />
        <input
          hlmInput
          id="token"
          type="password"
          autocomplete="current-password"
          placeholder="Access token"
          class="bg-background h-row w-full rounded-control pr-4 pl-11"
          [formControl]="token"
          [attr.aria-invalid]="error() ? 'true' : null"
          [attr.aria-describedby]="error() ? 'token-error token-hint' : 'token-hint'"
        />
      </div>
      <p id="token-hint" class="text-muted-foreground text-footnote px-1">
        The bridge stores it in ~/.config/spacee-herdr/token on the host
      </p>
    </div>
    @if (error(); as message) {
      <p id="token-error" role="alert" class="text-status-blocked-text text-footnote font-medium">
        {{ message }}
      </p>
    }
    <button hlmBtn type="submit" class="h-row w-full rounded-control" [disabled]="busy()">
      Sign in
    </button>
  </form>
</main>
