<main
  class="page-padding mx-auto flex min-h-dvh max-w-md flex-col justify-center gap-8 pt-[max(1rem,env(safe-area-inset-top))]"
>
  <div class="flex flex-col gap-1">
    <h1 class="text-title font-semibold tracking-tight">spacee-herdr</h1>
    <p class="text-muted-foreground text-body">Your herdr terminals, on your phone.</p>
  </div>
  <form class="flex flex-col gap-3" (submit)="$event.preventDefault(); submit()">
    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="token" class="group-label px-0">Access token</label>
      <input
        hlmInput
        id="token"
        type="password"
        autocomplete="current-password"
        class="bg-card h-row rounded-control px-4"
        [formControl]="token"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? 'token-error token-hint' : 'token-hint'"
      />
      <p id="token-hint" class="text-muted-foreground text-footnote">
        The bridge stores it in ~/.config/spacee-herdr/token on the host
      </p>
    </div>
    @if (error(); as message) {
      <p id="token-error" role="alert" class="text-status-blocked-text text-footnote font-medium">
        {{ message }}
      </p>
    }
    <button hlmBtn type="submit" class="h-row w-full rounded-control" [disabled]="busy()">
      Sign in
    </button>
  </form>
</main>
